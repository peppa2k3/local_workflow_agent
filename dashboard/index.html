<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Workflow Studio</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, Arial, sans-serif; background: #0b1020; color: #edf2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 18% 0%, #1c315b 0, transparent 34%), #0b1020; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    .shell { max-width: 1200px; margin: auto; padding: 30px 22px 60px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 26px; }
    .eyebrow { color: #86a8ff; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; }
    h1 { margin: 7px 0 6px; font-size: clamp(27px, 4vw, 40px); letter-spacing: -.04em; }
    p { margin: 0; color: #9aa8c5; line-height: 1.5; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid #314262; border-radius: 99px; background: #15213a; white-space: nowrap; font-size: 13px; }
    .dot { height: 8px; width: 8px; border-radius: 50%; background: #f2b84b; }
    .dot.ok { background: #35d6a1; }
    .toolbar, .editor, .step { background: #121c31; border: 1px solid #263653; box-shadow: 0 12px 30px #03071233; }
    .toolbar { border-radius: 18px; padding: 16px; display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    label { display: grid; gap: 7px; color: #acbbd6; font-size: 12px; font-weight: 600; }
    input, select { min-height: 40px; color: #eef3ff; background: #0b1426; border: 1px solid #334361; border-radius: 9px; padding: 9px 11px; outline: none; }
    input:focus, select:focus { border-color: #7b9fff; box-shadow: 0 0 0 3px #789cff26; }
    .toolbar select { width: 230px; }
    .toolbar input { width: 220px; }
    .file-path-control { display: flex; gap: 6px; align-items: center; }
    .file-path-control input { min-width: 0; flex: 1; }
    .file-path-control .btn { white-space: nowrap; }
    .btn { min-height: 40px; border-radius: 9px; padding: 9px 15px; color: #edf2ff; background: #263956; font-weight: 700; }
    .btn:hover { filter: brightness(1.15); }
    .btn.primary { background: #587cff; color: white; }
    .btn.success { background: #168c69; }
    .btn.danger { background: #6c3343; }
    .btn.ghost { background: transparent; border: 1px solid #344464; }
    .editor { border-radius: 18px; padding: 20px; }
    .editor-head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    .editor-head input { width: min(360px, 80vw); }
    .steps { display: grid; gap: 12px; }
    .step { border-radius: 13px; padding: 16px; }
    .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .number { background: #243a6a; color: #b6c9ff; border-radius: 8px; min-width: 30px; height: 30px; display: grid; place-items: center; font-weight: 800; }
    .step-head select { min-width: 175px; }
    .spacer { flex: 1; }
    .icon { background: #25344e; color: #c6d2eb; width: 31px; height: 31px; border-radius: 7px; }
    .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .fields label:first-child { grid-column: span 2; }
    .fields input { width: 100%; }
    .add { width: 100%; margin-top: 14px; border: 1px dashed #536b9a; background: #172541; color: #bed0ff; min-height: 46px; border-radius: 10px; font-weight: 700; }
    .bottom { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
    .message { color: #9fbee8; min-height: 21px; font-size: 13px; }
    .message.error { color: #ff9aa7; }
    .progress { margin-top: 18px; border: 1px solid #2c3b57; border-radius: 13px; padding: 14px 16px; background: #101a2d; font-size: 13px; color: #b7c5df; }
    .progress strong { color: #f2f5ff; }
    @media (max-width: 700px) { .top { flex-direction: column; } .fields { grid-template-columns: 1fr; } .fields label:first-child { grid-column: auto; } .toolbar select, .toolbar input { width: 100%; } .toolbar label { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">Local automation</div><h1>Workflow Studio</h1><p>Tạo kịch bản trực quan và chạy trên Chrome profile hiện có.</p></div>
      <div class="status"><span class="dot" id="connectionDot"></span><span id="connectionText">Đang kết nối agent...</span></div>
    </header>

    <section class="toolbar" aria-label="Quản lý kịch bản">
      <label>Kịch bản đã lưu<select id="scenarioSelect"></select></label>
      <button class="btn ghost" id="loadBtn">Mở</button>
      <label>Tên file mới<input id="fileName" placeholder="vi-du: facebook-reels" spellcheck="false"></label>
      <button class="btn ghost" id="newBtn">Tạo mới</button>
      <label>File upload cho lần chạy<span class="file-path-control"><input id="uploadPath" placeholder="C:\\...\\anh.jpg (tùy chọn)" spellcheck="false"><button class="btn ghost" id="chooseRunFile" type="button">Chọn file…</button></span></label>
      <span class="spacer"></span>
      <button class="btn" id="saveBtn">Lưu</button>
      <button class="btn success" id="runBtn">▶ Chạy kịch bản</button>
      <button class="btn danger" id="stopBtn">Dừng</button>
    </section>

    <section class="editor">
      <div class="editor-head"><div><h2>Các bước thực hiện</h2><p>Kéo luồng theo thứ tự từ trên xuống bằng nút ↑ ↓.</p></div><label>Tên hiển thị<input id="scenarioName" placeholder="Tên kịch bản"></label></div>
      <div class="steps" id="steps"></div>
      <button class="add" id="addBtn">＋ Thêm bước</button>
      <div class="bottom"><div class="message" id="message" role="status"></div><span id="stepCount"></span></div>
    </section>
    <div class="progress"><strong>Trạng thái:</strong> <span id="progress">Chưa chạy</span></div>
  </main>
  <script>
    const actions = {
      openUrl: { label: 'Mở URL', fields: [['url', 'URL', 'text']] },
      openFolder: { label: 'Mở thư mục', fields: [['path', 'Đường dẫn thư mục', 'text']] },
      wait: { label: 'Chờ thời gian', fields: [['ms', 'Mili giây', 'number']] },
      waitFor: { label: 'Chờ phần tử', fields: [['locatorType', 'Cách tìm', 'locatorType'], ['locator', 'Chữ / tên / XPath / selector', 'text'], ['role', 'Role (khi tìm theo role)', 'text'], ['index', 'Vị trí từ 0 (nếu trùng)', 'number'], ['timeoutMs', 'Timeout (ms)', 'number']] },
      click: { label: 'Click phần tử', fields: [['locatorType', 'Cách tìm', 'locatorType'], ['locator', 'Chữ / tên / XPath / selector', 'text'], ['role', 'Role (khi tìm theo role)', 'text'], ['index', 'Vị trí từ 0 (nếu trùng)', 'number'], ['timeoutMs', 'Timeout (ms)', 'number']] },
      type: { label: 'Nhập chữ', fields: [['locatorType', 'Cách tìm', 'locatorType'], ['locator', 'Chữ / tên / XPath / selector', 'text'], ['role', 'Role (khi tìm theo role)', 'text'], ['index', 'Vị trí từ 0 (nếu trùng)', 'number'], ['text', 'Nội dung nhập', 'text'], ['clear', 'Xóa nội dung cũ (true/false)', 'boolean']] },
      upload: { label: 'Upload file', fields: [['locatorType', 'Cách tìm nút / input file', 'locatorType'], ['locator', 'Nút mở chọn file (click trước), hoặc input[type=file]', 'text'], ['role', 'Role (khi tìm theo role)', 'text'], ['index', 'Vị trí từ 0 (nếu trùng)', 'number'], ['filePath', 'Đường dẫn file đầy đủ', 'text'], ['folder', 'Hoặc: thư mục', 'text'], ['filename', 'Và: tên file', 'text'], ['timeoutMs', 'Timeout chờ ô file (ms)', 'number'], ['waitAfterMs', 'Chờ sau khi chọn file (ms)', 'number']] },
      scroll: { label: 'Cuộn trang', fields: [['pixels', 'Số pixel', 'number'], ['times', 'Số lần', 'number'], ['intervalMs', 'Khoảng cách (ms)', 'number']] }
    };
    const defaults = {
      openUrl: { url: 'https://www.facebook.com/' }, openFolder: { path: 'C:\\Users\\Administrator\\Downloads' },
      wait: { ms: 1000 }, waitFor: { locatorType: 'text', locator: 'Tiếp', timeoutMs: 5000 },
      click: { locatorType: 'role', role: 'button', locator: 'Tiếp', timeoutMs: 5000 },
      type: { locatorType: 'placeholder', locator: 'Tìm kiếm', text: '', clear: true },
      upload: { locatorType: 'css', locator: '', filePath: '' },
      scroll: { pixels: 650, times: 3, intervalMs: 2500 }
    };
    const $ = id => document.getElementById(id);
    let fileName = 'facebook-reels';
    let scenario = { name: 'Mở và cuộn Facebook Reels', steps: [] };
    let pickTargetIndex = null;
    let pickId = null;

    async function api(route, method = 'GET', body) {
      const response = await fetch(route, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    function notice(text, error = false) { $('message').textContent = text; $('message').classList.toggle('error', error); }
    async function chooseFile(input) {
      const current = input.value.trim();
      const initialDirectory = current.replace(/[\\/][^\\/]*$/, '');
      const result = await api('/api/choose-file', 'POST', { initialDirectory });
      if (result.filePath) {
        input.value = result.filePath;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        notice(`Đã chọn file: ${result.filePath}`);
      }
    }
    function field(labelText, value, type, update) {
      const label = document.createElement('label');
      label.textContent = labelText;
      const input = document.createElement(type === 'locatorType' ? 'select' : 'input');
      if (type === 'locatorType') {
        for (const [key, text] of Object.entries({ role: 'Role + tên', text: 'Chữ hiển thị', label: 'Label', placeholder: 'Placeholder', testid: 'Test ID', xpath: 'XPath', css: 'CSS' })) {
          const option = document.createElement('option'); option.value = key; option.textContent = text; input.append(option);
        }
      } else input.type = type === 'number' ? 'number' : 'text';
      input.value = value ?? '';
      input.addEventListener(type === 'locatorType' ? 'change' : 'input', () => update(type === 'number' ? (input.value === '' ? undefined : Number(input.value)) : type === 'boolean' ? input.value === 'true' : input.value));
      if (labelText === 'Đường dẫn file đầy đủ') {
        const control = document.createElement('span'); control.className = 'file-path-control';
        const button = document.createElement('button'); button.type = 'button'; button.className = 'btn ghost'; button.textContent = 'Chọn file…';
        button.addEventListener('click', () => handle(() => chooseFile(input)));
        control.append(input, button); label.append(control);
      } else label.append(input);
      return label;
    }
    function render() {
      $('scenarioName').value = scenario.name || '';
      $('stepCount').textContent = `${scenario.steps.length} bước`;
      const list = $('steps'); list.replaceChildren();
      scenario.steps.forEach((step, index) => {
        const card = document.createElement('article'); card.className = 'step';
        const head = document.createElement('div'); head.className = 'step-head';
        const number = document.createElement('span'); number.className = 'number'; number.textContent = index + 1;
        const select = document.createElement('select');
        for (const [key, value] of Object.entries(actions)) {
          const option = document.createElement('option'); option.value = key; option.textContent = value.label; select.append(option);
        }
        select.value = step.action;
        select.addEventListener('change', () => { scenario.steps[index] = { action: select.value, ...defaults[select.value] }; render(); });
        head.append(number, select);
        const spacer = document.createElement('span'); spacer.className = 'spacer'; head.append(spacer);
        for (const [label, offset] of [['↑', -1], ['↓', 1]]) {
          const button = document.createElement('button'); button.className = 'icon'; button.textContent = label;
          button.title = offset < 0 ? 'Lên' : 'Xuống'; button.disabled = index + offset < 0 || index + offset >= scenario.steps.length;
          button.addEventListener('click', () => { [scenario.steps[index], scenario.steps[index + offset]] = [scenario.steps[index + offset], scenario.steps[index]]; render(); });
          head.append(button);
        }
        const remove = document.createElement('button'); remove.className = 'icon'; remove.textContent = '×'; remove.title = 'Xóa bước';
        remove.addEventListener('click', () => { scenario.steps.splice(index, 1); render(); }); head.append(remove);
        if (['click', 'waitFor', 'type', 'upload'].includes(step.action)) {
          const pick = document.createElement('button'); pick.className = 'btn ghost'; pick.textContent = '◎ Chọn trên trang';
          pick.addEventListener('click', () => handle(async () => {
            const result = await api('/api/pick/start', 'POST');
            pickTargetIndex = index; pickId = result.id;
            notice('Chuyển sang tab cần thao tác, đưa chuột lên phần tử và click. Nhấn Esc để hủy.');
          }));
          head.append(pick);
        }
        const fields = document.createElement('div'); fields.className = 'fields';
        for (const [key, label, type] of actions[step.action].fields) fields.append(field(label, step[key] ?? (key === 'locatorType' ? 'css' : ''), type, value => { if (value === undefined) delete step[key]; else step[key] = value; }));
        card.append(head, fields); list.append(card);
      });
    }
    async function refreshNames() {
      const { names } = await api('/api/scenarios');
      const select = $('scenarioSelect'); select.replaceChildren();
      for (const name of names) { const option = document.createElement('option'); option.value = name; option.textContent = name; select.append(option); }
      select.value = fileName;
    }
    async function load(name) {
      scenario = await api(`/api/scenarios/${encodeURIComponent(name)}`); fileName = name; $('fileName').value = name;
      for (const step of scenario.steps) {
        if (step.selector && !step.locator) { step.locatorType = 'css'; step.locator = step.selector; delete step.selector; }
      }
      render(); notice(`Đã mở ${name}.json`);
    }
    async function save() {
      scenario.name = $('scenarioName').value.trim();
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(fileName)) throw new Error('Tên file chỉ dùng chữ thường, số, dấu - hoặc _');
      await api(`/api/scenarios/${fileName}`, 'PUT', scenario);
      await refreshNames(); notice(`Đã lưu ${fileName}.json`);
    }
    function handle(task) { Promise.resolve().then(task).catch(error => notice(error.message, true)); }
    $('loadBtn').onclick = () => handle(() => load($('scenarioSelect').value));
    $('newBtn').onclick = () => handle(() => {
      const name = $('fileName').value.trim();
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(name)) throw new Error('Nhập tên file hợp lệ trước khi tạo');
      fileName = name; scenario = { name, steps: [{ action: 'openUrl', ...defaults.openUrl }] }; render(); notice('Kịch bản mới chưa lưu.');
    });
    $('saveBtn').onclick = () => handle(save);
    $('runBtn').onclick = () => handle(async () => { await save(); await api('/api/run', 'POST', { name: fileName, uploadPath: $('uploadPath').value.trim() }); notice('Đã bắt đầu chạy.'); });
    $('chooseRunFile').onclick = () => handle(() => chooseFile($('uploadPath')));
    $('stopBtn').onclick = () => handle(async () => { await api('/api/stop', 'POST'); notice('Đã dừng.'); });
    $('addBtn').onclick = () => { scenario.steps.push({ action: 'click', ...defaults.click }); render(); };
    $('scenarioName').oninput = event => { scenario.name = event.target.value; };
    async function updateStatus() {
      try {
        const state = await api('/api/status');
        $('connectionDot').classList.toggle('ok', state.extensionConnected);
        $('connectionText').textContent = `${state.profile} · Extension ${state.extensionConnected ? 'đã kết nối' : 'chưa kết nối'}`;
        $('progress').textContent = state.error || (state.running ? `Đang chạy bước ${state.index + 1}/${state.total}: ${state.action || 'đang chờ'}${state.requiredUrl ? ' · chờ tab tải xong' : ''}` : 'Đang chờ lệnh');
        if (pickId !== null) {
          const picked = await api('/api/pick/status');
          if (picked.id === pickId && !picked.active) {
            if (picked.result && scenario.steps[pickTargetIndex]) {
              Object.assign(scenario.steps[pickTargetIndex], picked.result);
              render(); notice('Đã chọn phần tử. Bấm Lưu để lưu locator.');
            } else notice('Đã hủy chọn phần tử.');
            pickId = null; pickTargetIndex = null;
          }
        }
      } catch { $('connectionText').textContent = 'Agent chưa chạy'; }
    }
    handle(async () => { await refreshNames(); await load(fileName); });
    updateStatus(); setInterval(updateStatus, 1500);
  </script>
</body>
</html>
