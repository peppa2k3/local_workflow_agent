<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="local-agent-session" content="__LOCAL_AGENT_DASHBOARD_TOKEN__"><title>Scan YouTube</title>
<link rel="stylesheet" href="/remote.css"><script src="/scanner.js" defer></script></head><body class="scanner"><main class="shell">
<nav class="site-nav" aria-label="Điều hướng chính"><div class="row site-links"><a href="/">Kịch bản</a><a href="/content">Quản lý nội dung</a><a href="/remote">Remote Control</a><a href="/scanner" aria-current="page">Scan YouTube</a></div></nav>
<header><h1>Quét YouTube</h1><button id="toggle" class="primary" disabled>Bật quét</button></header>
<p id="state" class="muted"></p>
<div class="scanner-editor"><form id="config" class="panel"><h2>Điều kiện lọc</h2>
<div class="scanner-thresholds">
<label>Lượt xem tối thiểu<input id="minViews" type="number" min="0" max="9007199254740991" required></label>
<label>Cạnh ngắn tối thiểu (px)<input id="minResolution" type="number" min="1" max="8192" required></label>
<label>Tuổi video từ (ngày)<input id="minDays" type="number" min="0" max="36500" required></label>
<label>Tuổi video đến (ngày)<input id="maxDays" type="number" min="0" max="36500" required></label>
<label>Chu kỳ quét (phút)<input id="minutes" type="number" min="1" max="1440" required></label>
<label>Yêu cầu API mỗi ngày<input id="requestsPerDay" type="number" min="1" max="100" required></label>
</div>
<label>Ngôn ngữ phụ đề (cách nhau bằng dấu phẩy)<input id="subtitleLanguages" required placeholder="vi, en"></label>
<fieldset><legend>Loại phụ đề</legend><label class="check"><input id="subtitles" type="checkbox">Thủ công</label><label class="check"><input id="automatic_captions" type="checkbox">Tự động</label></fieldset>
<button class="primary" disabled>Lưu bộ lọc</button><p role="status" id="configNote"></p></form>
<form id="keywordForm" class="panel"><h2>Nhóm từ khóa</h2><label>Nội dung keywords.txt <small>Mỗi nhóm bắt đầu bằng [ma-nhom]. Nhập một cụm từ trên mỗi dòng.</small><textarea id="keywords" rows="9" required spellcheck="false"></textarea></label>
<button disabled>Lưu từ khóa</button><p role="status" id="keywordNote"></p></form></div>
<section class="panel"><div class="row"><h2>Kết quả gần nhất</h2><button id="export">Xuất kho JSON</button></div>
<div class="scanner-filters"><label>Tìm video<input id="resultQuery" type="search" placeholder="Tiêu đề, chủ đề hoặc ID"></label>
<label>Trạng thái<select id="filter"><option value="all">Mọi kết quả</option><option value="pass">Đạt điều kiện</option><option value="pending">Đang chờ gửi</option><option value="synced">Đã đồng bộ</option><option value="reject">Không đạt</option><option value="unknown">Chưa đủ dữ liệu</option></select></label><label>Kết quả mỗi trang<select id="pageSize"><option value="5">5</option><option value="10">10</option></select></label></div>
<details class="scanner-check-filters"><summary>Lọc theo từng điều kiện <span id="activeChecks" class="badge" hidden></span></summary>
<div id="checkFilters" class="scanner-check-grid"></div>
<button id="clearChecks" type="button" disabled>Xóa lọc điều kiện</button>
</details>
<p id="feedback" role="status"></p><div id="rows"></div>
<nav class="row scanner-pages" aria-label="Phân trang kết quả"><button id="prevPage" disabled>Trang trước</button><span id="pageInfo" role="status"></span><button id="nextPage" disabled>Trang sau</button></nav></section></main></body></html>
