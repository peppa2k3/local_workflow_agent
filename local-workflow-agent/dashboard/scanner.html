</style><script defer="" src="/scanner.js"></script></head><body class="workspace scanner"><script>(() => {
  const key = 'local-dashboard.toasts.v1';
  const stack = document.createElement('div');
  stack.className = 'toast-stack';
  stack.setAttribute('aria-live', 'polite');
  stack.setAttribute('aria-relevant', 'additions');
  document.body.append(stack);
  const active = new Map();

  function save() {
    try {
      sessionStorage.setItem(key, JSON.stringify([...active.keys()]));
    } catch {
      /* Toasts still work when session storage is unavailable. */
    }
  }

  function mount(item) {
    const remaining = item.expires - Date.now();
    if (remaining <= 0) return;
    const element = document.createElement('div');
    element.className = 'toast toast-' + item.type;
    element.textContent = item.message;
    stack.append(element);
    const timer = setTimeout(() => {
      const positions = [...stack.children].map((el) => [el, el.getBoundingClientRect().top]);
      element.remove();
      active.delete(item);
      save();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (const [el, top] of positions) {
        if (!el.isConnected) continue;
        el.getAnimations().forEach((animation) => animation.cancel());
        const offset = top - el.getBoundingClientRect().top;
        if (offset)
          el.animate([{ transform: 'translateY(' + offset + 'px)' }, { transform: 'none' }], {
            duration: 180,
            easing: 'ease-out',
          });
      }
    }, remaining);
    active.set(item, timer);
  }

  function restore() {
    for (const timer of active.values()) clearTimeout(timer);
    active.clear();
    stack.replaceChildren();
    try {
      for (const item of JSON.parse(sessionStorage.getItem(key) || '[]')) {
        if (
          item &&
          ['success', 'error'].includes(item.type) &&
          typeof item.message === 'string' &&
          Number.isFinite(item.expires)
        )
          mount(item);
      }
    } catch {
      /* Ignore invalid saved state. */
    }
    save();
  }
  function show(type, message) {
    if (!message) return;
    mount({ type, message: String(message), expires: Date.now() + 5000 });
    save();
  }
  window.toast = Object.freeze({
    success: (message) => show('success', message),
    error: (message) => show('error', message),
  });
  restore();
  addEventListener('pageshow', (event) => {
    if (event.persisted) restore();
  });
})();
</script><script>window.askConfirmation = async function askConfirmation(message) {
  const id = crypto.randomUUID();
  const post = async (route, body) => {
    const response = await fetch('/api/remote/' + route, { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Local-Agent-Session': document.querySelector('meta[name=local-agent-session]').content },
      body: JSON.stringify({ id, ...body }) });
    if (!response.ok) throw Error('Không gửi được yêu cầu xác nhận.');
    return response.json();
  };
  const dialog = document.createElement('dialog');
  const question = document.createElement('p');
  question.id = 'confirmation-' + id;
  dialog.setAttribute('aria-labelledby', question.id);
  question.textContent = message;
  dialog.append(question);
  const answer = proceed => post('prompt-answer', { proceed }).catch(error => window.toast.error(error.message));
  for (const [label, proceed] of [['Yes', true], ['No', false]]) {
    const button = document.createElement('button');
    button.textContent = label;
    button.onclick = () => answer(proceed);
    dialog.append(button);
  }
  dialog.oncancel = event => { event.preventDefault(); answer(false); };
  document.body.append(dialog);
  dialog.showModal();
  try { return (await post('prompt-open', { message })).proceed; }
  catch (error) { window.toast.error(error.message); return false; }
  finally { dialog.remove(); }
};

ả mỗi trang<select id="pageSize"><option value="5">5</option><option value="10">10</option></select></label></div><details class="scanner-check-filters"><summary>Lọc theo từng điều kiện<!-- --> <span id="activeChecks" class="badge" hidden=""></span></summary><div id="checkFilters" class="scanner-check-grid"></div><button id="clearChecks" type="button" disabled="">Xóa lọc điều kiện</button></details><p id="feedback" role="status"></p><div class="row scanner-selection"><label><input id="selectPage" type="checkbox" disabled=""/> Chọn cả trang</label><span id="selectionCount" role="status">Đã chọn 0</span><label class="dashboard-field">Thao tác với mục đã chọn<select id="bulkOperation"><option value="">Chọn thao tác</option></select></label><button id="applyBulk" type="button" disabled="">Áp dụng</button><button id="clearSelection" type="button" disabled="">Bỏ chọn</button></div><div id="rows"></div><nav class="row scanner-pages" aria-label="Phân trang kết quả"><button id="prevPage" disabled="">Trang trước</button><span id="pageInfo" role="status"></span><button id="nextPage" disabled="">Trang sau</button></nav></section></main></body></html>
