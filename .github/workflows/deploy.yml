name: Deploy control server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-server-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Set VPS_SSH_PRIVATE_KEY and VPS_SSH_KNOWN_HOSTS in the production environment'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload source and build the control container on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${VPS_PORT:-22}"
          root=/opt/agent-local
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Set VPS_HOST to the VPS hostname or IPv4 address'; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Set VPS_USER to the SSH deployment user'; exit 1; }
          [[ "$port" =~ ^[0-9]+$ ]] || { echo 'Invalid VPS_PORT'; exit 1; }
          port_number=$((10#$port))
          (( port_number >= 1 && port_number <= 65535 )) || { echo 'Invalid VPS_PORT'; exit 1; }
          port="$port_number"

          remote="$VPS_USER@$VPS_HOST"
          release="$root/releases/$GITHUB_SHA"
          ssh_options=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" -p "$port" "$remote" "mkdir -p '$release'"
          git archive --format=tar "$GITHUB_SHA" control-server |
            ssh "${ssh_options[@]}" -p "$port" "$remote" "tar -xf - --strip-components=1 -C '$release'"
          ssh "${ssh_options[@]}" -p "$port" "$remote" \
            "bash '$release/deploy/deploy-container.sh' apply '$root' '$GITHUB_SHA'"
