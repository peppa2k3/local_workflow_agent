name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate VPS source deployment Compose
        env:
          APP_SOURCE_ROOT: ${{ github.workspace }}/control-server
          RELEASE_TAG: ${{ github.sha }}
        run: >-
          docker compose --project-directory "$GITHUB_WORKSPACE"
          --env-file control-server/deploy/source.env.example
          -f control-server/deploy/docker-compose.source.yml config --quiet
      - name: Validate VPS source deployment through Traefik
        env:
          APP_SOURCE_ROOT: ${{ github.workspace }}/control-server
          RELEASE_TAG: ${{ github.sha }}
          TRAEFIK_NETWORK: web
          CONTROL_TRAEFIK_IPS: 172.18.0.8
          TRAEFIK_CERT_RESOLVER: le
        run: |
          set -o pipefail
          docker compose --project-directory "$GITHUB_WORKSPACE" \
            --env-file control-server/deploy/source.env.example \
            -f control-server/deploy/docker-compose.source.yml \
            -f control-server/deploy/docker-compose.source.traefik.yml config --format json |
            jq -e '
              .networks.traefik.external and .networks.traefik.name == "web" and
              (.services.control |
                (.network_mode == null) and (.ports == null) and
                .environment.CONTROL_BIND == "0.0.0.0" and
                .environment.CONTROL_TRUSTED_PROXY_IPS == "172.18.0.8" and
                .labels["traefik.http.routers.local-agent-control.rule"] == "Host(`agent.dangngochai.io.vn`)" and
                .labels["traefik.http.routers.local-agent-control.tls.certresolver"] == "le" and
                .labels["traefik.http.services.local-agent-control.loadbalancer.server.port"] == "34800")
            '
      - name: Build control-server image
        run: docker build --pull --file control-server/deploy/Dockerfile --tag "local-agent-control-ci:$GITHUB_SHA" control-server
      - name: Check VPS deploy script syntax
        run: bash -n control-server/deploy/deploy-container.sh
