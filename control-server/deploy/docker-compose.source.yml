name: ${COMPOSE_PROJECT_NAME:-local-agent-control}
services:
  control:
    image: local-agent-control:${RELEASE_TAG:?Set RELEASE_TAG to the commit SHA}
    build:
      context: ${APP_SOURCE_ROOT:?Set APP_SOURCE_ROOT to the release source}
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${RELEASE_TAG:?Set RELEASE_TAG to the commit SHA}
        REVISION: ${RELEASE_TAG:?Set RELEASE_TAG to the commit SHA}
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    # Share the Linux host network so the host Nginx proxy can reach loopback.
    network_mode: host
    environment:
      NODE_ENV: production
      CONTROL_PUBLIC_URL: https://${CONTROL_DOMAIN:?Set CONTROL_DOMAIN}
      CONTROL_BIND: 127.0.0.1
      CONTROL_PORT: "34800"
      CONTROL_DATABASE: /data/control.sqlite
      CONTROL_TRUST_PROXY: "1"
      CONTROL_TRUSTED_PROXY_IPS: ""
      CONTROL_ALLOW_HTTP_LOOPBACK: "0"
    volumes:
      - control-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  control-data:
    name: ${CONTROL_VOLUME_NAME:-local-agent-control-data}
