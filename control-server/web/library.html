<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho video · Control Server</title>
<link rel="stylesheet" href="/style.css"><script defer src="/library.js"></script></head><body><main class="shell">
  <nav class="main-nav" aria-label="Điều hướng chính"><a href="/devices">Thiết bị</a><a href="/library" aria-current="page">Kho video</a></nav>
<header><div><span class="eyebrow">Local Agent / Control Center</span><h1>Kho video</h1></div></header><p id="feedback" role="status"></p>
<div id="library" hidden>
<section class="panel"><h2>Giao việc tự động</h2><form id="assignment"><label><input id="autoEnabled" type="checkbox"> Tự tạo và giao job từ kho video</label><label>Chờ khi hết slot (giờ)<input id="retryHours" type="number" min="0.016666666666666666" max="720" step="any" required></label><button>Lưu cài đặt</button></form></section>
<section class="panel"><h2>Danh sách video</h2><div class="two"><label>Tìm theo tiêu đề, chủ đề, ID, máy gửi hoặc #tag<input id="query" type="search"></label>
<label>Trạng thái sử dụng<select id="used"><option value="">Tất cả</option><option value="false">Chưa dùng</option><option value="true">Đã dùng</option></select></label></div>
<div class="two"><label>Máy đích<select id="device"></select></label><label>Kịch bản lấy biến<select id="scenario"></select></label></div>
<div class="video-toolbar"><label>Video mỗi trang<select id="pageSize"><option>12</option><option>24</option><option>48</option></select></label>
<button id="refresh">Làm mới</button></div><p id="page" role="status"></p>
<div id="videos"></div><nav class="video-pages" aria-label="Phân trang video"><button id="prev" disabled>Trang trước</button><span id="pageNumbers"></span><button id="next" disabled>Trang sau</button></nav></section></div></main></body></html>
